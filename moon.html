<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#080d19">
	<meta name="description" content="">
	<title>"Mi luna"</title>
	<link rel="stylesheet" href="moon.css">
</head>
<body>
	<main class="night-scene" aria-label="Una noche bajo la luna">
		<div class="sky-glow" aria-hidden="true"></div>
		<div class="stars stars--distant" aria-hidden="true"></div>
		<div class="stars stars--near" aria-hidden="true"></div>
		<div class="shooting-star" aria-hidden="true"></div>

		<div class="moon-path" aria-hidden="true">
			<div class="moon-halo">
				<div class="moon">
					<span class="crater crater--large"></span>
					<span class="crater crater--upper"></span>
					<span class="crater crater--lower"></span>
					<span class="crater crater--small"></span>
					<span class="crater crater--edge"></span>
					<span class="moon-grain"></span>
				</div>
			</div>
		</div>

		<div class="cloud cloud--high" aria-hidden="true"></div>
		<div class="cloud cloud--low" aria-hidden="true"></div>
		<div class="distant-ridge" aria-hidden="true"></div>
		<div class="near-ridge" aria-hidden="true"></div>
		<div class="night-mist" aria-hidden="true"></div>

		<a class="back-link" href="index.html" aria-label="Volver al inicio">
			<span aria-hidden="true">&#8592;</span> Inicio
		</a>
		<p class="scene-caption">"La luna está muy bonita hoy"</p>
	</main>
</body>
</html>
